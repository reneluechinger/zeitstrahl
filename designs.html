<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitstrahl – 4 Designentwürfe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<script src="stations.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#222;color:#111;min-height:100vh}
  .bar{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid #555;background:#222;color:#fff;cursor:pointer}
  .bar button.on{background:#fff;color:#111;border-color:#fff;font-weight:700}
  .bar .sp{flex:1}
  .bar label{font-size:14px;opacity:.85}
  .bar input{width:70px;font:inherit;padding:6px;border-radius:8px;border:0;margin-left:4px}
  .stage{max-width:820px;margin:0 auto;min-height:calc(100vh - 56px);position:relative;overflow:hidden}
  .nav{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:0 auto;padding:12px 14px;color:#fff}
  .nav button{font:inherit;font-size:18px;padding:12px 22px;border-radius:12px;border:0;background:#fff;color:#111;font-weight:700;cursor:pointer}
  .credit{font-size:11px;opacity:.7}
  .credit a{color:inherit}
  img.photo{display:block;width:100%;object-fit:cover}
  .gapbg{background:radial-gradient(ellipse at 50% 40%,#1a1f35 0%,#05060b 70%);position:relative}
  .gapbg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 80%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 85% 20%,#fff7 50%,transparent 51%)}

  /* A Nachthimmel */
  .A{background:#0b0e1a;color:#eef;min-height:inherit}
  .A .imgwrap{height:58vh;overflow:hidden;border-radius:0 0 32px 32px}
  .A img.photo,.A .gapbg{height:100%}
  .A .body{padding:28px 32px 40px}
  .A .when{font-family:Fraunces,serif;font-size:clamp(28px,5vw,44px);color:#ffd27a;font-weight:700}
  .A h1{font-size:clamp(24px,4vw,34px);margin:8px 0 14px}
  .A p{font-size:clamp(18px,2.6vw,22px);line-height:1.5;opacity:.9}
  .A .pos{margin-top:18px;font-size:15px;opacity:.7}

  /* B Museumskarte */
  .B{background:#f3ede2;color:#2b2620;min-height:inherit;padding:34px 30px}
  .B .tag{display:inline-block;background:#2b2620;color:#f3ede2;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:4px}
  .B .frame{margin:20px 0 24px;background:#fff;padding:14px;box-shadow:0 10px 30px #0002;border-radius:4px}
  .B img.photo,.B .gapbg{height:46vh}
  .B h1{font-family:Fraunces,serif;font-size:clamp(30px,5vw,46px);line-height:1.1}
  .B .when{font-family:Fraunces,serif;font-style:italic;font-size:clamp(20px,3vw,26px);color:#8a5a2b;margin:6px 0 14px}
  .B p{font-size:clamp(18px,2.6vw,22px);line-height:1.55}
  .B .pos{margin-top:16px;font-size:15px;color:#6b6257}

  /* C Zeitband */
  .C{background:#fff;color:#0d0d0d;min-height:inherit;font-family:"Space Grotesk",sans-serif}
  .C img.photo,.C .gapbg{height:44vh}
  .C .band{padding:22px 28px 6px}
  .C .track{position:relative;height:16px;background:linear-gradient(90deg,#1b1b3a,#3a2a6b 30%,#b4532a 70%,#2a8f5a);border-radius:8px}
  .C .marker{position:absolute;top:-8px;width:4px;height:32px;background:#0d0d0d;border-radius:2px;transform:translateX(-2px)}
  .C .marker::after{content:"Du bist hier";position:absolute;top:36px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:700}
  .C .ends{display:flex;justify-content:space-between;font-size:13px;margin-top:30px;opacity:.6}
  .C .big{display:flex;gap:24px;align-items:baseline;padding:10px 28px 0;flex-wrap:wrap}
  .C .big .m{font-size:clamp(44px,8vw,72px);font-weight:700;line-height:1}
  .C .big .w{font-size:clamp(18px,2.6vw,22px);opacity:.75}
  .C h1{font-size:clamp(26px,4.5vw,40px);padding:16px 28px 8px}
  .C p{font-size:clamp(18px,2.6vw,22px);line-height:1.5;padding:0 28px 30px;font-family:Inter,sans-serif}

  /* D Poster */
  .D{position:relative;min-height:calc(100vh - 56px);color:#fff;background:#000}
  .D img.photo,.D .gapbg{position:absolute;inset:0;height:100%}
  .D .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000c 75%)}
  .D .num{position:absolute;top:24px;left:28px;font-family:Fraunces,serif;font-weight:700;font-size:clamp(70px,14vw,140px);line-height:.9;text-shadow:0 4px 30px #000a}
  .D .num small{display:block;font-size:.25em;font-family:Inter,sans-serif;font-weight:600;letter-spacing:.04em;margin-top:8px}
  .D .panel{position:absolute;left:20px;right:20px;bottom:20px;padding:24px 26px;border-radius:22px;background:#0006;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff3}
  .D h1{font-size:clamp(26px,4.5vw,40px);margin-bottom:10px}
  .D p{font-size:clamp(18px,2.6vw,22px);line-height:1.5}
  .D .pos{margin-top:12px;font-size:15px;opacity:.8}
</style>
</head>
<body>
<div class="bar">
  <button data-d="A" class="on">A · Nachthimmel</button>
  <button data-d="B">B · Museumskarte</button>
  <button data-d="C">C · Zeitband</button>
  <button data-d="D">D · Poster</button>
  <span class="sp"></span>
  <label>Strecke <input id="len" type="number" value="50" min="5"> m</label>
</div>
<div class="nav"><button id="prev">‹ zurück</button><span id="count"></span><button id="next">weiter ›</button></div>
<div class="stage" id="stage"></div>

<script>
let design = "A", i = 0;
const stage = document.getElementById("stage");
const len = () => Math.max(1, +document.getElementById("len").value || 50);

function visual(s) {
  if (s.gap) return `<div class="gapbg"></div>`;
  return `<img class="photo" src="${imgUrl(s.img)}" alt="${s.title}">`;
}
function credit(s) {
  if (s.gap) return "";
  return `<div class="credit">Bild: ${s.credit}, <a href="${commonsPage(s.img)}" target="_blank" rel="noopener">${s.license}</a></div>`;
}
function posLine(s) {
  const p = positionM(s, len());
  const rest = len() - p;
  return `Station bei ${fmtDist(p)} · noch ${fmtDist(rest)} bis heute`;
}
function numParts(s) {
  if (s.years === 0) return ["Heute", ""];
  if (s.years >= 1e9) return [(s.years / 1e9).toLocaleString("de-CH", {maximumFractionDigits: 2}), "Milliarden Jahre"];
  if (s.years >= 1e6) return [Math.round(s.years / 1e6).toLocaleString("de-CH"), "Millionen Jahre"];
  return [Math.round(s.years / 1e3).toLocaleString("de-CH"), "Tausend Jahre"];
}

function render() {
  const s = STATIONS[i];
  const nr = s.gap ? "Zwischenhütchen" : `Station ${s.id} von 15`;
  let h = "";
  if (design === "A") {
    h = `<div class="A"><div class="imgwrap">${visual(s)}</div><div class="body">
      <div class="when">${s.when}</div><h1>${s.title}</h1><p>${s.text}</p>
      <div class="pos">${posLine(s)}</div>${credit(s)}</div></div>`;
  } else if (design === "B") {
    h = `<div class="B"><span class="tag">${nr}</span><div class="frame">${visual(s)}</div>
      <h1>${s.title}</h1><div class="when">${s.when}</div><p>${s.text}</p>
      <div class="pos">${posLine(s)}</div>${credit(s)}</div>`;
  } else if (design === "C") {
    const pct = (1 - s.years / UNIVERSE_AGE) * 100;
    h = `<div class="C">${visual(s)}
      <div class="band"><div class="track"><div class="marker" style="left:${pct}%"></div></div>
      <div class="ends"><span>Urknall</span><span>Heute</span></div></div>
      <div class="big"><span class="m">${fmtDist(positionM(s, len()))}</span><span class="w">${s.when}</span></div>
      <h1>${s.title}</h1><p>${s.text}<br><br>${credit(s)}</p></div>`;
  } else {
    const [n, u] = numParts(s);
    h = `<div class="D">${visual(s)}<div class="shade"></div>
      <div class="num">${n}<small>${u ? u + " her" : ""}</small></div>
      <div class="panel"><h1>${s.title}</h1><p>${s.text}</p><div class="pos">${posLine(s)}</div>${credit(s)}</div></div>`;
  }
  stage.innerHTML = h;
  document.getElementById("count").textContent = `${i + 1} / ${STATIONS.length}`;
}
document.querySelectorAll(".bar button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".bar button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); design = b.dataset.d; render();
});
document.getElementById("prev").onclick = () => { i = (i - 1 + STATIONS.length) % STATIONS.length; render(); };
document.getElementById("next").onclick = () => { i = (i + 1) % STATIONS.length; render(); };
document.getElementById("len").oninput = render;
let x0 = null;
stage.addEventListener("touchstart", e => x0 = e.touches[0].clientX);
stage.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) (dx < 0 ? document.getElementById("next") : document.getElementById("prev")).click(); x0 = null; });
render();
</script>
</body>
</html>
